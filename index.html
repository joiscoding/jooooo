<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Lookbook — Men</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var key = 'lookbook-theme';
        function parsePref(raw) {
          if (raw === 'light' || raw === 'dark' || raw === 'system') return raw;
          return 'system';
        }
        var pref = 'system';
        try {
          pref = parsePref(localStorage.getItem(key));
        } catch (e) {}
        var prefersDark = false;
        try {
          prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
        } catch (e) {}
        var scheme =
          pref === 'light'
            ? 'light'
            : pref === 'dark'
              ? 'dark'
              : prefersDark
                ? 'dark'
                : 'light';
        document.documentElement.setAttribute('data-color-scheme', scheme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
