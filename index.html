<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Lookbook — Men</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var key = 'lookbook-theme';
          var raw = localStorage.getItem(key);
          var pref = 'system';
          if (raw && raw !== '') {
            try {
              var p = JSON.parse(raw);
              if (p === 'system' || p === 'light' || p === 'dark') pref = p;
            } catch (e) {
              if (raw === 'system' || raw === 'light' || raw === 'dark')
                pref = raw;
            }
          }
          var darkMq = window.matchMedia('(prefers-color-scheme: dark)');
          var prefersDark = darkMq.matches;
          var resolved =
            pref === 'light' ? 'light' : pref === 'dark' ? 'dark' : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme =
            resolved === 'dark' ? 'dark' : 'light';
        } catch (err) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
